[package]
name = "elysium-web"
version = "0.1.0"
edition = "2021"
description = "Elysium Engine — WebAssembly/WebGL build"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen = "0.2"
js-sys = "0.3"
web-sys = { version = "0.3", features = [
    "Window",
    "Document",
    "HtmlCanvasElement",
    "WebGl2RenderingContext",
    "WebGlProgram",
    "WebGlShader",
    "WebGlBuffer",
    "WebGlTexture",
    "WebGlUniformLocation",
    "WebGlFramebuffer",
    "WebGlRenderbuffer",
    "WebGlActiveInfo",
    "KeyboardEvent",
    "MouseEvent",
    "WheelEvent",
    "console",
    "Performance",
    "Element",
    "HtmlElement",
    "CssStyleDeclaration",
    "HtmlInputElement",
    "Event",
    "EventTarget",
    "Node",
    "Text",
    "WebSocket",
    "MessageEvent",
    "CloseEvent",
    "BinaryType",
    "ErrorEvent",
    "ProgressEvent",
] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rand = { version = "0.8", default-features = false }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
