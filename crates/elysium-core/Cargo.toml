[package]
name = "elysium-core"
description = "Elysium Engine core: ECS, memory, entity system"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
rust-version.workspace = true

[dependencies]
rayon.workspace = true
rkyv.workspace = true
nalgebra.workspace = true
glam = { workspace = true, features = ["serde"] }
bytemuck = { version = "1.21", features = ["derive"] }
thiserror.workspace = true
tracing.workspace = true
hashbrown.workspace = true
smallvec.workspace = true
bitflags.workspace = true
parking_lot.workspace = true
rand.workspace = true
futures = { workspace = true }
tokio = { version = "1.43", features = ["rt-multi-thread", "macros", "sync", "net", "time"] }
serde = { workspace = true, features = ["derive"] }
serde_json = "1.0"
bincode.workspace = true
toml = "0.8"
sha2 = "0.10"
once_cell = "1.19"
num_cpus = { workspace = true }
zip = "2.1"
uuid = { version = "1.10", features = ["v4", "serde"] }
zstd = "0.13"
lz4 = "0.26"
chacha20poly1305 = "0.10"
aes-gcm = "0.10"
backtrace = "0.3"
minidump-writer = { version = "0.2", optional = true }
minidump = { version = "0.8", optional = true }
libc = { version = "0.2", optional = true }
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_System_Diagnostics_Debug", "Win32_Stdio", "Win32_UI_WindowsAndMessaging"], optional = true }

[features]
default = []
crash_handler = ["minidump-writer", "minidump", "libc", "windows-sys"]
